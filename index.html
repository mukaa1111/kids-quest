<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>탐험대 미션</title>
<meta name="description" content="하루 15분, 받아쓰기·영어·지식 퀴즈 미션을 깨고 카드를 모으는 탐험대 게임">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a4a">
<style>
  :root {
    --bg: #1b2a4a; --bg2: #24365e; --card: #ffffff; --text: #1f2430; --muted: #6b7280; --line: #e3e6ee;
    --accent: #ff8c42; --accent2: #ffb84d; --good: #2ecc71; --bad: #ff5c5c; --blue: #4aa3ff; --purple: #9b6bff;
    --gold: #ffd166; --silver: #cfd8e3; --plain: #c3c9d4;
    --vh: 100vh;   /* 실제로 보이는 화면 높이. 브라우저 주소창·탭 줄을 뺀 높이를 쓴다 */
  }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(circle at 20% 10%, #2d4a7a 0, var(--bg) 45%, #121c33 100%); color: #fff;
    font: 20px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; overflow-x: hidden; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 40px; min-height: 100%; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .top .who { font-weight: 800; font-size: 22px; }
  .top .who small { font-weight: 500; color: #c9d4ea; font-size: 15px; margin-left: 8px; }
  .top button { font-size: 16px; padding: 8px 14px; }
  button { font: inherit; border: 0; border-radius: 16px; cursor: pointer; }
  .btn { display: block; width: 100%; min-height: 64px; padding: 14px 18px; margin: 10px 0; font-size: 22px; font-weight: 700;
    background: var(--card); color: var(--text); box-shadow: 0 6px 0 #c9cfdd; transition: transform .05s; text-align: left; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9cfdd; }
  .btn.main { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #1f1300; box-shadow: 0 6px 0 #b85c1f; text-align: center; font-size: 26px; }
  .btn.main:active { box-shadow: 0 2px 0 #b85c1f; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; text-align: center; font-size: 18px; min-height: 52px; }
  .panel .btn.ghost { background: #eef1f7; color: var(--text); }
  .btn.opt { font-size: 26px; text-align: center; }
  .btn.opt.good { background: var(--good); color: #fff; box-shadow: 0 6px 0 #1f9d55; }
  .btn.opt.bad { background: var(--bad); color: #fff; box-shadow: 0 6px 0 #c23c3c; }
  .btn:disabled { opacity: .85; }
  .btn.done { background: #d9f7e4; color: #1f6b3d; }
  .btn .tag { float: right; font-size: 16px; color: var(--muted); font-weight: 500; }
  .panel { background: var(--card); color: var(--text); border-radius: 20px; padding: 18px; margin: 10px 0; }
  .panel h2 { margin: 0 0 6px; font-size: 22px; }
  .panel p { margin: 6px 0; }
  .center { text-align: center; }
  .big { font-size: 34px; font-weight: 800; line-height: 1.3; }
  .huge { font-size: 64px; line-height: 1.1; }
  .muted { color: var(--muted); font-size: 16px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .prog { height: 14px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
  .prog > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); width: 0; transition: width .3s; }
  .combo { position: fixed; left: 50%; transform: translateX(-50%); top: 10px; pointer-events: none; background: var(--gold); color: #3a2a00; font-weight: 900; padding: 6px 12px; border-radius: 99px; font-size: 18px; display: none; z-index: 5; }
  .blank { display: inline-block; min-width: 90px; border-bottom: 4px solid var(--accent); text-align: center; color: var(--accent); font-weight: 800; }
  input.ans { width: 100%; font: inherit; font-size: 28px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 14px; text-align: center; }
  input.ans:focus { outline: none; border-color: var(--blue); }
  .speak { display: inline-block; font-size: 22px; background: var(--blue); color: #fff; border-radius: 99px; padding: 10px 18px; margin: 6px 0; }
  .why { background: #fff6e5; border-radius: 12px; padding: 10px 12px; font-size: 17px; margin-top: 10px; }
  .cardbox { perspective: 1000px; width: 220px; height: 300px; margin: 16px auto; }
  .cardi { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .9s; }
  .cardi.flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .face.back { background: repeating-linear-gradient(45deg, #2a3b66 0 10px, #1f2d50 10px 20px); border: 4px solid #6c7fb8; font-size: 70px; }
  .face.front { transform: rotateY(180deg); background: #fff; color: var(--text); border: 6px solid var(--plain); padding: 10px; text-align: center; }
  /* 등급별 테두리: 일반 무광 회색, 희귀 은색, 전설 금색 + 빛 */
  .g2, .g3 { --rim: linear-gradient(135deg, #f7f9fc, #8d99aa 22%, #ffffff 45%, #7b8798 68%, #e8edf4 88%, #9aa6b6); --in: linear-gradient(#f8fbff, #e6eef9); }
  .g3 { --rim: linear-gradient(135deg, #fff4b8, #d2921a 22%, #fffbe0 45%, #c2820c 68%, #ffe680 88%, #d99a1c); --in: linear-gradient(#fffdf3, #ffefba); }
  .face.front.g2, .face.front.g3, .cc.g2, .cc.g3 { border-color: transparent; background: var(--in) padding-box, var(--rim) border-box; }
  .face.front.g2 { box-shadow: 0 0 20px rgba(210, 228, 255, .75); }
  .face.front.g3 { box-shadow: 0 0 36px var(--gold), inset 0 0 0 2px #e9bf55; }
  .face.front.g2::after, .face.front.g3::after, .cc.g2::after, .cc.g3::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.8) 50%, transparent 62%) 150% 0 / 250% 100% no-repeat; animation: shine 3.2s ease-in-out infinite; }
  @keyframes shine { 0%, 35% { background-position: 150% 0; } 85%, 100% { background-position: -50% 0; } }
  .rb { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 900; letter-spacing: .06em; padding: 2px 12px; border-radius: 99px; white-space: nowrap; color: #3d4654; background: linear-gradient(135deg, #eef2f7, #b4bfcd); }
  .g3 .rb { color: #5a3a00; background: linear-gradient(135deg, #ffe680, #e0a425); }
  .art { display: block; width: 1.5em; height: 1.125em; margin: 0 auto; }
  .face.front .em { font-size: 86px; line-height: 1.1; } .face.front .nm { font-size: 20px; font-weight: 800; margin-top: 6px; word-break: keep-all; line-height: 1.2; }
  .face.front .gr { font-size: 14px; color: var(--muted); }
  .shake { animation: shake .6s 3; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.05); } 75% { transform: rotate(6deg) scale(1.05); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .cc { position: relative; background: #fff; color: var(--text); border-radius: 14px; padding: 10px 6px; text-align: center; border: 4px solid var(--plain); }
  .cc.g3 { box-shadow: 0 0 14px rgba(255, 209, 102, .8); }
  .cc.no { background: rgba(255,255,255,.12); color: #c9d4ea; border-color: transparent; }
  .cc .em { font-size: 44px; } .cc .nm { font-size: 14px; font-weight: 700; } .cc .ct { font-size: 12px; color: var(--muted); }
  .score { display: flex; justify-content: space-around; font-size: 22px; font-weight: 800; }
  .score .on { color: var(--accent); }
  /* memory */
  /* 게임판은 보이는 화면 높이(--vh)에서 위아래 글자·버튼 자리를 빼고 남는 만큼만 커진다 */
  .mem { --bw: 460px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: max(240px, min(var(--bw), calc((var(--vh) - 270px) * 4 / 3))); margin: 10px auto; }
  .mc { aspect-ratio: 1; border-radius: 14px; background: #4a5f94; display: flex; align-items: center; justify-content: center; font-size: 44px; cursor: pointer; }
  .mc.open { background: #fff; } .mc.ok { background: #d9f7e4; }
  .timer { font-size: 20px; font-weight: 800; color: var(--gold); text-align: center; }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 9; }
  .toast { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -20px) scale(.9); background: linear-gradient(135deg, #fff7d6, #ffe08a); color: #3a2a00; border-radius: 22px; padding: 18px 26px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.4); z-index: 20; display: none; min-width: 260px; max-width: 90vw; }
  .toast.on { display: block; animation: pop .5s ease-out forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -20px) scale(.8); } 60% { transform: translate(-50%, 0) scale(1.06); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  .toast .em { font-size: 64px; line-height: 1.1; } .toast .t1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; } .toast .t2 { font-size: 26px; font-weight: 900; } .toast .t3 { font-size: 15px; opacity: .8; }
  .bd { display: flex; align-items: center; gap: 12px; background: #fff; color: var(--text); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; border: 3px solid var(--gold); }
  .bd.no { background: rgba(255,255,255,.1); color: #c9d4ea; border-color: transparent; }
  .bd .em { font-size: 40px; width: 52px; text-align: center; } .bd .nm { font-weight: 800; font-size: 18px; } .bd .hint { font-size: 14px; opacity: .8; }
  .homebtn { width: auto !important; margin: 0 !important; min-height: 60px !important; min-width: 72px; font-size: 28px !important; padding: 8px 18px !important; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
  .tile { min-width: 64px; min-height: 64px; font-size: 30px; font-weight: 800; background: #fff; color: var(--text); border-radius: 14px; box-shadow: 0 5px 0 #c9cfdd; }
  .tile:disabled { opacity: .25; box-shadow: none; }
  .spelled { min-height: 56px; font-size: 40px; font-weight: 900; letter-spacing: .12em; color: var(--blue); border-bottom: 4px dashed var(--line); margin: 6px auto 0; display: inline-block; min-width: 200px; }
  .moles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: max(210px, min(520px, calc(var(--vh) - 280px))); margin: 12px auto; }
  .hole { aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 70%, #5b3a1e 0 55%, #8a5a2e 56%); font-size: min(64px, 9vh); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .final { font-size: 120px; font-weight: 900; line-height: 1.1; color: var(--accent); text-shadow: 0 5px 0 #ffe1c4; }
  .final small { font-size: 36px; margin-left: 6px; }
  .final.pop { animation: boom .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes boom { 0% { transform: scale(0) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.4) rotate(4deg); opacity: 1; } 80% { transform: scale(.92); } 100% { transform: scale(1); } }
  .sky { --skyh: max(230px, calc(var(--vh) - 310px)); position: relative; height: var(--skyh); overflow: hidden; border-radius: 18px; background: linear-gradient(#69b7ff, #d9f1ff); margin: 10px 0; touch-action: manipulation; }
  .bal { position: absolute; bottom: -90px; font-size: 62px; line-height: 1; background: none; padding: 4px; animation: rise linear forwards; }
  @keyframes rise { to { transform: translateY(calc(-1 * var(--skyh) - 120px)); } }
  .catch { background: linear-gradient(#10173a, #43337a); touch-action: none; cursor: pointer; }
  .fall { position: absolute; left: 0; top: 0; font-size: 44px; line-height: 1; pointer-events: none; will-change: transform; }
  .basket { position: absolute; left: 0; bottom: 6px; width: 80px; margin-left: -40px; text-align: center; font-size: 64px; line-height: 1; pointer-events: none; }
  .gsc { text-align: center; font-size: 22px; font-weight: 800; color: #fff; }
  .tgl { display: inline-block; width: auto; min-height: 44px; padding: 8px 14px; margin: 4px; font-size: 16px; border-radius: 12px; background: #eef1f7; color: var(--text); }
  .tgl.on { background: #d9f7e4; color: #1f6b3d; font-weight: 800; }
  .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 10px auto; }
  .pinpad button { font-size: 26px; padding: 14px 0; background: #eef1f7; color: var(--text); border-radius: 12px; }
  .kidbtn { font-size: 30px; min-height: 90px; text-align: center; }
  .small { font-size: 15px; }
  @media (max-width: 480px) { body { font-size: 18px; } .big { font-size: 28px; } .btn.opt { font-size: 22px; } }
  /* 갤럭시 탭 S6 라이트 세로(약 800×1330): 글자와 버튼을 키움 */
  @media (orientation: portrait) and (min-width: 700px) {
    body { font-size: 23px; }
    .wrap { padding: 22px 24px 60px; }
    .btn { min-height: 76px; font-size: 25px; }
    .btn.opt { min-height: 84px; font-size: 30px; }
    .btn.main { font-size: 30px; }
    .big { font-size: 40px; }
    .panel { padding: 24px; }
    .kidbtn { min-height: 110px; font-size: 34px; }
    .cardbox { width: 260px; height: 350px; }
    .mem { --bw: 520px; }
    .mc { font-size: 54px; }
  }
  /* 갤럭시 탭 S6 라이트 가로(약 1330×800): 보기 버튼을 두 칸으로 */
  @media (orientation: landscape) and (min-width: 1000px) {
    .wrap { max-width: 1100px; padding-top: 10px; }
    .btn.opt, .kidbtn { display: inline-block; width: calc(50% - 8px); margin: 6px 4px; vertical-align: top; }
    .btn.opt { min-height: 76px; }
    .mem { --bw: 380px; }
    .cardbox { width: 190px; height: 260px; margin: 8px auto; }
  }
  /* 화면이 낮으면 카드 뽑기 화면의 카드를 줄여 아래 설명과 버튼이 한 화면에 들어오게 */
  @media (max-height: 760px) {
    .cardbox { width: 176px; height: 240px; margin: 8px auto; }
    .face.front .em { font-size: 66px; } .face.front .nm { font-size: 17px; }
    .final { font-size: 96px; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="combo" id="combo"></div>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>

<script src="data/dictation.js"></script>
<script src="data/english.js"></script>
<script src="data/quiz.js"></script>
<script src="data/quiz2.js"></script>
<script src="data/dict-audio.js"></script>
<script src="data/cards.js"></script>
<script src="data/card-art.js"></script>
<script>
(function () {
  // ---------- 저장 ----------
  var KEY = "quest.v1";
  var S = load();
  function load() {
    var d = null; try { d = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (!d) d = { kids: [{ name: "룰루", cards: {}, streak: 0, lastDay: "", battles: 0 }, { name: "랄라", cards: {}, streak: 0, lastDay: "", battles: 0 }], pin: "2468", day: {}, battleDay: "", cur: -1 };
    if (!d.hist) d.hist = [{}, {}];          // 날짜별 기록: hist[아이][날짜] = { d, e, q, card }
    d.kids.forEach(function (k) { if (!k.badges) k.badges = {}; });
    if (!d.seen) d.seen = [{}, {}, {}];        // 이미 나온 문제: seen[아이 또는 2=배틀][묶음] = [문제 열쇠…]
    if (!d.games) d.games = { gmole: true, gcatch: true, gballoon: true, gmem: true };   // 부모가 켜 둔 보상 게임
    if (d.games.gcatch === undefined) d.games.gcatch = true;   // 나중에 생긴 게임은 켜진 상태로 시작
    return d;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dayState(k) {
    var t = today();
    if (S.day.date !== t) { S.day = { date: t, k: [{}, {}] }; }
    if (!S.day.k) S.day.k = [{}, {}];
    return S.day.k[k];
  }
  function kid() { return S.kids[S.cur]; }

  // ---------- 도구 ----------
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a, n) { return shuffle(a).slice(0, n); }
  // 아직 안 나온 문제부터 n개 고른다. 다 나오면 기록을 비우고 처음부터.
  function pickFresh(who, pool, items, n, keyOf) {
    var seen = S.seen[who][pool] || [], out = [];
    var fresh = shuffle(items.filter(function (x) { return seen.indexOf(keyOf(x)) < 0; }));
    out = fresh.slice(0, n);
    if (out.length < n) {
      seen = [];
      var used = out.map(keyOf);
      out = out.concat(shuffle(items.filter(function (x) { return used.indexOf(keyOf(x)) < 0; })).slice(0, n - out.length));
    }
    S.seen[who][pool] = seen.concat(out.map(keyOf)); save();
    return out;
  }
  function leftFresh(who, pool, items, keyOf) { var seen = S.seen[who][pool] || []; return items.filter(function (x) { return seen.indexOf(keyOf(x)) < 0; }).length; }
  function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
  // 받아쓰기 문장은 미리 만든 한국어 음성 파일로 읽는다 (패드가 영어 목소리로 한국어를 읽는 문제 방지). 파일이 없으면 패드 음성.
  var koAudio = null;
  function sayKo(text) {
    var f = window.DICT_AUDIO && window.DICT_AUDIO[text];
    try { if (window.speechSynthesis) speechSynthesis.cancel(); if (koAudio) { koAudio.pause(); koAudio = null; } } catch (e) {}
    if (!f) return speak(text, "ko-KR");
    try {
      koAudio = new Audio("sounds/dict/" + f);
      koAudio.onerror = function () { speak(text, "ko-KR"); };
      var pr = koAudio.play(); if (pr && pr.catch) pr.catch(function () { speak(text, "ko-KR"); });
    } catch (e) { speak(text, "ko-KR"); }
  }
  function speak(text, lang) {
    try {
      if (!window.speechSynthesis) return false;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = lang || "ko-KR"; u.rate = 0.85;
      var vs = speechSynthesis.getVoices().filter(function (v) { return v.lang && v.lang.replace("_", "-").toLowerCase().indexOf((lang || "ko-KR").toLowerCase().slice(0, 2)) === 0; });
      if (vs.length) u.voice = vs[0];
      speechSynthesis.speak(u); return true;
    } catch (e) { return false; }
  }
  // 효과음 (파일 없이)
  var AC = null;
  function beep(kind) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var seq = { good: [[660, .08], [880, .12]], bad: [[220, .18]], card: [[523, .1], [659, .1], [784, .1], [1047, .25]], tick: [[440, .05]] }[kind] || [[440, .1]];
      var t = AC.currentTime;
      seq.forEach(function (n) { var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = n[0]; o.type = kind === "bad" ? "sawtooth" : "sine"; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + n[1]); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + n[1]); t += n[1]; });
    } catch (e) {}
  }
  // 폭죽
  var fx = $("fx"), fctx = fx.getContext("2d"), parts = [];
  function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; } sizeFx(); addEventListener("resize", sizeFx);
  function confetti(n) {
    for (var i = 0; i < (n || 60); i++) parts.push({ x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .6, y: innerHeight * .45 + (Math.random() - .5) * 120, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, c: ["#ff8c42", "#ffd166", "#2ecc71", "#4aa3ff", "#9b6bff", "#ff5c5c"][i % 6], s: 6 + Math.random() * 8, a: 1 });

        '<div class="tiles" id="tiles"></div>' +
        '<div class="row"><button class="btn ghost" data-go="tileback">⌫ 지우기</button><button class="btn ghost" data-go="tilegiveup">모르겠어요</button></div><div id="fb"></div>');
      drawTiles();
      setTimeout(function () { speak(w.en, "en-US"); }, 300);

      render(top() + head + '설명에 맞는 단어는?</div>' +
        '<div class="panel center"><div class="big" style="font-size:30px">' + esc(w.def) + '</div></div>' + optEn + '<div id="fb"></div>');
    } else {                     // 듣고 고르기
      render(top() + head + '잘 듣고 골라요</div>' +
        '<div class="panel center"><button class="speak" style="font-size:44px;padding:22px 44px" data-go="say">🔊</button><p class="muted">다시 들으려면 눌러요</p></div>' + optEn + '<div id="fb"></div>');
      setTimeout(function () { speak(w.en, "en-US"); }, 300);
    }
  }
  function drawTiles() {
    var sp = M.sp; if (!sp || !$("tiles")) return;
    $("tiles").innerHTML = sp.tiles.map(function (ch, i) { return '<button class="tile" data-tile="' + i + '"' + (sp.picked.indexOf(i) >= 0 ? ' disabled' : '') + '>' + esc(ch) + '</button>'; }).join("");
    $("spelled").textContent = sp.picked.map(function (i) { return sp.tiles[i]; }).join("");
  }
  function tapTile(i) {
    var sp = M.sp; if (M.lock || !sp || sp.picked.indexOf(i) >= 0) return;

  }
  function answerEng(ans) {

    document.querySelectorAll("[data-tile]").forEach(function (b) { b.disabled = true; });

    $("fb").innerHTML = '<div class="panel center"><div class="big">' + (ok ? '정답! 🎉' : '아쉽다!') + '</div><p><b style="font-size:28px">' + esc(w.en) + '</b> = ' + esc(w.ko) + (w.ex ? '<br><span class="muted">' + esc(w.ex) + '</span>' : '') + '</p><button class="btn main" data-go="next">다음 ➜</button></div>';
  }

  // ---------- 미션: 지식 퀴즈 ----------
  function quizKey(x) { return x.q; }
  function screenQuizPick() {
    var rec = topicOfDay();
    render(top() + '<div class="panel center"><div class="big" style="font-size:28px">어떤 주제로 풀까?</div><p class="muted">주제마다 10문제. 안 풀어 본 문제가 먼저 나와요.</p></div>' +
      Object.keys(QUIZ).map(function (t) {
        var left = leftFresh(S.cur, "quiz:" + t, QUIZ[t].items, quizKey);

      }).join(""));
  }
  function startQuiz(topic, n) {

  }
  function stepQuiz() {
    if (M.i >= M.items.length) return M.battle ? battleNext() : finishMission("quiz", M.ok, M.items.length);
    var it = M.items[M.i], opts = shuffle(it.o.map(function (o, idx) { return { t: o, ok: idx === it.a }; }));
    var who = M.battle ? '<div class="score"><span class="' + (M.turn === 0 ? 'on' : '') + '">' + esc(S.kids[0].name) + ' ' + M.sc[0] + '</span><span class="' + (M.turn === 1 ? 'on' : '') + '">' + esc(S.kids[1].name) + ' ' + M.sc[1] + '</span></div><div class="center muted" style="color:#ffd166;margin:6px 0">👉 ' + esc(S.kids[M.turn].name) + ' 차례!</div>' : '';
    render((M.battle ? '<div class="top"><div class="who">⚔️ 형제 배틀 · ' + esc(M.topic) + '</div><button class="btn ghost" style="width:auto;margin:0" data-go="kids">✖</button></div>' : top()) + who +
      '<div class="muted" style="color:#c9d4ea">' + QUIZ[M.topic].emoji + ' ' + esc(M.topic) + ' ' + (M.i + 1) + '/' + M.items.length + '</div>' +
      '<div class="panel"><div class="big" style="font-size:26px">' + esc(it.q) + '</div></div>' +
      opts.map(function (o) { return '<button class="btn opt" style="font-size:22px" data-opt="' + esc(o.t) + '" data-ok="' + (o.ok ? 1 : 0) + '">' + esc(o.t) + '</button>'; }).join("") + '<div id="fb"></div>');
  }
  function answerQuiz(btn) {
    if (M.lock) return; M.lock = true;
    var it = M.items[M.i], ok = btn.getAttribute("data-ok") === "1";
    if (ok) { if (M.battle) M.sc[M.turn]++; else M.ok++; right(); } else wrong();
    document.querySelectorAll("[data-opt]").forEach(function (b) { b.disabled = true; if (b.getAttribute("data-ok") === "1") b.classList.add("good"); else if (b === btn) b.classList.add("bad"); });
    $("fb").innerHTML = '<div class="panel center"><div class="big">' + (ok ? '정답! 🎉' : '아쉽다! 정답은 <b>' + esc(it.o[it.a]) + '</b>') + '</div><div class="why">💡 ' + esc(it.why) + '</div><button class="btn main" data-go="next">다음 ➜</button></div>';
  }

  // ---------- 미션 끝 ----------
  function finishMission(kind, ok, total) {
    var d = dayState(S.cur); d[kind] = true; d[kind + "ok"] = ok;
    var h = S.hist[S.cur][today()] = S.hist[S.cur][today()] || {}; h[kind[0]] = ok; save();
    checkBadges(S.cur, { kind: kind, ok: ok, total: total });
    combo = 0; showCombo();
    confetti(80); beep("card");
    var n = (d.dict ? 1 : 0) + (d.eng ? 1 : 0) + (d.quiz ? 1 : 0);
    render(top() + '<div class="panel center"><div class="huge">' + (ok === total ? '🏆' : ok >= total * 0.6 ? '🌟' : '💪') + '</div><div class="big">' + ok + ' / ' + total + ' 맞혔어요!</div>' +
      '<p class="muted">' + (n === 3 ? '미션 3개 완료! 카드를 뽑아요.' : '미션 ' + n + '/3 · 남은 미션 ' + (3 - n) + '개') + '</p>' +
      '<button class="btn main" data-go="' + (n === 3 ? 'card' : 'home') + '">' + (n === 3 ? '🎁 카드 뽑기!' : '다음 미션 ➜') + '</button></div>');
  }

  // ---------- 카드 뽑기 ----------
  function drawCard() {
    var d = dayState(S.cur);
    if (d.card) return showCard(d.card, false);
    var r = Math.random(), grade = r < .05 ? 3 : r < .30 ? 2 : 1;
    var pool = CARDS.filter(function (c) { return c.grade === grade; });
    var c = pool[Math.floor(Math.random() * pool.length)];
    var k = kid(); k.cards[c.id] = (k.cards[c.id] || 0) + 1;
    var t = today(); if (k.lastDay !== t) { k.streak = (k.lastDay === yesterday() ? k.streak : 0) + 1; k.lastDay = t; }
    d.card = c.id; var h = S.hist[S.cur][t] = S.hist[S.cur][t] || {}; h.card = c.id; save();
    showCard(c.id, true);
    setTimeout(function () { checkBadges(S.cur, { card: c, dayDone: true }); }, 3200);
  }
  function yesterday() { var d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  // 카드 그림: data/card-art.js 에 그림이 있으면 그것을, 없으면 이모지를 쓴다
  function pic(c) { return (window.CARD_ART && CARD_ART[c.id]) || c.emoji; }
  function showCard(id, fresh) {
    var c = CARDS.filter(function (x) { return x.id === id; })[0]; var cnt = kid().cards[id] || 1;
    var gname = ["", "일반", "희귀 ✨", "전설 🌟"][c.grade];
    render(top() + '<div class="center"><div class="big">' + (fresh ? '오늘의 카드!' : '오늘 뽑은 카드') + '</div></div>' +
      '<div class="cardbox"><div class="cardi' + (fresh ? ' shake' : ' flip') + '" id="cardi"><div class="face back">🌟</div><div class="face front g' + c.grade + '">' + (c.grade > 1 ? '<div class="rb">' + (c.grade === 3 ? '🌟 전설' : '✨ 희귀') + '</div>' : '') + '<div class="em">' + pic(c) + '</div><div class="nm">' + esc(c.name) + '</div><div class="gr">' + c.set + ' · ' + gname + (cnt > 1 ? ' · ' + cnt + '장째' : '') + '</div></div></div></div>' +
      '<div class="panel center" id="cardfact" style="visibility:' + (fresh ? 'hidden' : 'visible') + '"><p>' + esc(c.fact) + '</p>' + (cnt > 1 && fresh ? '<p class="muted">또 나왔네! 같은 카드가 ' + cnt + '장이에요.</p>' : '') + '</div>' +
      '<button class="btn main" data-go="reward">🎮 보상 게임 2분!</button><button class="btn ghost" data-go="album">📚 카드첩</button>');
    if (fresh) setTimeout(function () { var e = $("cardi"); if (e) { e.classList.remove("shake"); e.classList.add("flip"); } beep("card"); confetti(c.grade === 3 ? 160 : 70); setTimeout(function () { var f = $("cardfact"); if (f) f.style.visibility = "visible"; }, 900); }, 1900);
  }

  // ---------- 보상 게임 ----------
  // 게임을 모두 합쳐 하루 2분(REWARD_SEC). 시작한 시각(d.rewardStart)을 저장해 두어서, 게임을 바꾸거나 새로 고쳐도 시간이 다시 차지 않는다.
  var REWARD_SEC = 120;   // 보상 게임 시간(초). 모든 게임을 합친 시간
  var timerId = null, G = null;
  var GAMES = [["gmole", "🔨 두더지 잡기"], ["gcatch", "🌠 별똥별 받기"], ["gballoon", "🎈 풍선 터뜨리기"], ["gmem", "🃏 기억력 카드"]];
  function stopGame() { if (G && G.iv) clearInterval(G.iv); G = null; }
  function rewardLeft(i) { var d = dayState(i); if (!d.rewardStart) { d.rewardStart = Date.now(); save(); } return REWARD_SEC - Math.floor((Date.now() - d.rewardStart) / 1000); }
  function fmtLeft(s) { s = Math.max(s, 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function screenReward() {
    var d = dayState(S.cur); stopGame();
    if (d.reward) return finishDay();
    if (d.rewardStart && rewardLeft(S.cur) <= 0) return endReward();
    var on = GAMES.filter(function (g) { return S.games[g[0]]; }); if (!on.length) on = GAMES;
    render(top() + '<div class="panel center"><div class="big">보상 게임을 골라요</div><p class="muted">' +
      (d.rewardStart ? '남은 시간 ' + fmtLeft(rewardLeft(S.cur)) + ' · 게임을 바꿔도 시간은 이어져요.' : '모두 합쳐 2분! 시간이 끝나면 오늘 탐험이 끝나요.') + '</p></div>' +
      on.map(function (g) { return '<button class="btn" data-go="' + g[0] + '">' + g[1] + '</button>'; }).join(""));
  }
  function startTimer() {
    var who = S.cur; clearInterval(timerId);
    function tick() {
      if (S.cur !== who) { clearInterval(timerId); return; }
      var left = rewardLeft(who), el = $("timer"); if (el) el.textContent = "⏱ " + fmtLeft(left);
      if (left <= 0) endReward(true);
    }
    tick(); timerId = setInterval(tick, 1000);
  }
  // auto: 시간이 다 되어 저절로 끝난 경우. 한 판짜리 게임 중이었다면 최종 점수부터 보여 준다
  function endReward(auto) {
    clearInterval(timerId); var d = dayState(S.cur); d.reward = true;
    if (auto && G && G.round && !G.last) { d.done = true; save(); return roundOver(true); }
    stopGame(); save(); finishDay();
  }
  function finishDay() { var d = dayState(S.cur); d.done = true; save(); screenLocked(); }
  function screenLocked() {
    var d = dayState(S.cur); var c = d.card ? CARDS.filter(function (x) { return x.id === d.card; })[0] : null;
    combo = 0; showCombo();
    render(top() + '<div class="panel center"><div class="huge">🌙</div><div class="big">오늘 탐험 완료!</div><p>내일 새 미션과 새 카드가 기다려요.</p>' + (c ? '<div class="huge">' + pic(c) + '</div><p><b>' + esc(c.name) + '</b></p>' : '') + '</div>' +
      '<div class="row"><button class="btn ghost" data-go="album">📚 카드첩</button><button class="btn ghost" data-go="badges">🏅 배지</button><button class="btn ghost" data-go="stats">📊 기록</button></div><button class="btn ghost" data-go="kids">↩ 대원 바꾸기</button><button class="btn ghost small" data-go="parent">🔒 부모님</button>');
  }
  // ownTimer: 게임이 제 타이머를 보여 주는 경우(두더지). 그때는 전체 남은 시간을 화면에 겹쳐 보이지 않는다
  function gameTop(hint, ownTimer) { return top() + (ownTimer || '<div class="timer" id="timer">⏱ ' + fmtLeft(REWARD_SEC) + '</div>') + '<div class="gsc">' + hint + ' · 점수 <span id="sc">0</span></div>'; }
  function gameFoot() { return '<div class="row"><button class="btn ghost" data-go="reward">🎮 다른 게임</button><button class="btn ghost" data-go="endreward">그만하고 끝내기</button></div>'; }
  function setScore(n) { var el = $("sc"); if (el) el.textContent = n; }

  // 기억력 카드
  function startMem() {
    stopGame();
    var ems = pick(["🦖", "🚀", "🐯", "🍕", "⚽", "🎸", "🐙", "🦁", "🍩", "🛸"], 6), deck = shuffle(ems.concat(ems));
    G = { key: "gmem", icon: "🃏", name: "기억력 카드", deck: deck, open: [], ok: 0, lock: false, score: 0, done: {}, tries: 0 };
    render(gameTop("같은 그림 두 장을 찾아요") + '<div class="mem" id="mem"></div>' + gameFoot());
    drawMem(); startTimer();
  }
  function drawMem() { var el = $("mem"); if (!el || !G || !G.deck) return; el.innerHTML = G.deck.map(function (e, i) { var st = G.done[i] ? "ok" : G.open.indexOf(i) >= 0 ? "open" : ""; return '<div class="mc ' + st + '" data-mem="' + i + '">' + (st ? e : "") + '</div>'; }).join(""); }
  function tapMem(i) {
    if (!G || !G.deck || G.lock || G.open.indexOf(i) >= 0 || G.done[i]) return;
    G.open.push(i); drawMem();
    if (G.open.length === 2) { G.lock = true; G.tries++; var a = G.open[0], c = G.open[1], g = G;
      setTimeout(function () { if (G !== g) return;
        if (g.deck[a] === g.deck[c]) { g.done[a] = g.done[c] = true; g.ok++; g.score++; setScore(g.score); right(); } else beep("tick");
        g.open = []; g.lock = false; drawMem();
        if (g.ok === 6) { g.round = g.won = true; setTimeout(function () { if (G === g && !g.over) roundOver(false); }, 700); } }, 600); }   // 다 찾으면 새 판을 깔지 않고 완성 화면으로
  }

  // 두더지 잡기: 나온 두더지를 톡! 별은 3점. 한 판은 ROUND_SEC초이고, 끝나면 최종 점수를 크게 보여 준다
  var ROUND_SEC = 30;   // 한 판짜리 게임(두더지, 별똥별)의 한 판 시간(초)
  function roundTimer(len) { return '<div class="timer">⏱ <span id="mleft">' + fmtLeft(len) + '</span></div>'; }
  function startMole() {
    stopGame();
    var len = Math.min(ROUND_SEC, Math.max(rewardLeft(S.cur), 1));
    G = { round: true, key: "gmole", icon: "🔨", name: "두더지 잡기", goal: [22, 10], mole: true, score: 0, cur: -1, hit: false, gold: false, end: Date.now() + len * 1000, next: 0 };
    var holes = ""; for (var i = 0; i < 9; i++) holes += '<button class="hole" data-hole="' + i + '"></button>';
    render(gameTop("두더지를 톡! ⭐는 3점", roundTimer(len)) + '<div class="moles" id="moles">' + holes + '</div>' + gameFoot());
    var g = G;
    function step() {
      if (G !== g || !$("moles")) { clearInterval(g.iv); return; }
      var now = Date.now(), el = $("mleft"); if (el) el.textContent = fmtLeft(Math.ceil((g.end - now) / 1000));
      if (now >= g.end) return roundOver(false);
      if (now < g.next) return;
      var n; do { n = Math.floor(Math.random() * 9); } while (n === g.cur);
      g.cur = n; g.hit = false; g.gold = Math.random() < .15; g.next = now + 850; drawMole();
    }
    step(); g.iv = setInterval(step, 100);
    startTimer();
  }
  // 한 판이 끝나면 최종 점수를 크게 보여 준다. last: 보상 시간이 다 되어 끝난 경우로, 점수를 보여 준 뒤 오늘 탐험을 마친다
  function roundOver(last) {
    var g = G, first = !g.over; clearInterval(g.iv); g.over = true; g.last = last;
    if (first) { beep("card"); confetti(120); }
    combo = 0; showCombo();
    render(top() + (last ? '' : '<div class="timer">남은 게임 시간 <span id="timer">⏱ ' + fmtLeft(rewardLeft(S.cur)) + '</span></div>') +
      '<div class="panel center"><div class="big">' + g.icon + ' ' + g.name + (g.won ? ' 완성!' : ' 끝!') + '</div><div class="final' + (first ? ' pop' : '') + '">' + (g.won ? '🎉' : g.score + '<small>점</small>') + '</div>' +
      '<p>' + (g.won ? g.tries + '번 뒤집어서 6쌍을 다 찾았어요!' : g.score >= g.goal[0] ? g.name + ' 달인! 🏆' : g.score >= g.goal[1] ? '정말 잘했어요! 🌟' : '다음엔 더 많이! 💪') + '</p></div>' +
      (last ? '<button class="btn main" data-go="locked">오늘 탐험 끝! ➜</button>' : '<button class="btn main" data-go="' + g.key + '">' + g.icon + ' 한 번 더!</button>' + gameFoot()));
  }
  function drawMole() { document.querySelectorAll("[data-hole]").forEach(function (h, i) { h.textContent = i === G.cur ? (G.hit ? "💥" : G.gold ? "⭐" : "🐹") : ""; }); }
  function tapHole(i) {
    if (!G || !G.mole || G.over || i !== G.cur || G.hit) return;
    G.hit = true; G.score += G.gold ? 3 : 1; setScore(G.score); beep("good"); drawMole();
  }

  // 별똥별 받기: 바구니를 좌우로 움직여 떨어지는 별을 받는다. ⭐ 1점, 🌟 3점, 💣 -2점. 한 판은 ROUND_SEC초
  function startCatch() {
    stopGame();
    var len = Math.min(ROUND_SEC, Math.max(rewardLeft(S.cur), 1));
    G = { round: true, key: "gcatch", icon: "🌠", name: "별똥별 받기", goal: [25, 12], score: 0, end: Date.now() + len * 1000, next: 0, items: [], bx: 0, t: Date.now() };
    render(gameTop("⭐ 받기! 🌟 3점 · 💣 -2점", roundTimer(len)) + '<div class="sky catch" id="field"><div class="basket" id="basket">🧺</div></div>' + gameFoot());
    var g = G, f = $("field"), bk = $("basket");
    function place(x) { g.bx = Math.max(40, Math.min(f.clientWidth - 40, x)); bk.style.transform = "translateX(" + g.bx + "px)"; }
    function onMove(e) { if (G === g && !g.over) place(e.clientX - f.getBoundingClientRect().left); }
    place(f.clientWidth / 2);
    f.addEventListener("pointerdown", onMove); f.addEventListener("pointermove", onMove);
    function step() {
      if (G !== g || !$("field")) { clearInterval(g.iv); return; }
      var now = Date.now(), dt = Math.min(now - g.t, 100) / 1000, w = f.clientWidth, h = f.clientHeight, el = $("mleft"); g.t = now;
      if (el) el.textContent = fmtLeft(Math.ceil((g.end - now) / 1000));
      if (now >= g.end) return roundOver(false);
      if (now >= g.next) {
        var r = Math.random(), k = r < .2 ? -2 : r < .32 ? 3 : 1, d = document.createElement("div");
        d.className = "fall"; d.textContent = k < 0 ? "💣" : k === 3 ? "🌟" : "⭐"; f.appendChild(d);
        g.items.push({ el: d, x: 30 + Math.random() * (w - 60), y: -50, v: h / (2 + Math.random() * 1.4), k: k });
        g.next = now + 560;
      }
      g.items = g.items.filter(function (it) {
        it.y += it.v * dt;
        if (it.y > h - 110 && it.y < h - 40 && Math.abs(it.x - g.bx) < 52) {      // 바구니에 들어옴
          g.score = Math.max(0, g.score + it.k); setScore(g.score); beep(it.k < 0 ? "bad" : "good"); it.el.remove();
          if (it.k < 0) { bk.textContent = "💥"; setTimeout(function () { bk.textContent = "🧺"; }, 300); }
          return false;
        }
        if (it.y > h) { it.el.remove(); return false; }
        it.el.style.transform = "translate(" + (it.x - 22) + "px," + it.y + "px)"; return true;
      });
    }
    step(); g.iv = setInterval(step, 16);
    startTimer();
  }

  // 풍선 터뜨리기: 올라오는 풍선을 톡! 별은 3점
  function startBalloon() {
    stopGame(); G = { score: 0 };
    render(gameTop("풍선을 톡! ⭐는 3점") + '<div class="sky" id="sky"></div>' + gameFoot());
    startTimer();
    var g = G;
    function spawn() {
      var sky = $("sky"); if (G !== g || !sky) { clearInterval(g.iv); return; }
      var gold = Math.random() < .12, b = document.createElement("button");
      b.className = "bal"; b.textContent = gold ? "⭐" : "🎈"; b.setAttribute("data-bal", gold ? 3 : 1);
      b.style.left = (2 + Math.random() * 82) + "%"; b.style.animationDuration = (3.2 + Math.random() * 2.6) + "s";
      b.style.filter = gold ? "" : "hue-rotate(" + Math.floor(Math.random() * 360) + "deg)";
      b.addEventListener("animationend", function () { b.remove(); });
      sky.appendChild(b);
    }
    spawn(); g.iv = setInterval(spawn, 520);
  }
  function tapBalloon(b) {
    if (!G || b.getAttribute("data-pop")) return;
    b.setAttribute("data-pop", "1"); G.score += +b.getAttribute("data-bal"); setScore(G.score); beep("good");
    b.textContent = "💥"; b.style.animationPlayState = "paused"; setTimeout(function () { b.remove(); }, 160);
  }

  // ---------- 형제 배틀 ----------
  function screenBattle() {
    if (!(S.kids[0].name && S.kids[1].name)) return screenNames();
    if (S.battleDay === today()) return render('<div class="panel center"><div class="huge">⚔️</div><div class="big">오늘 배틀은 끝났어요</div><p>내일 다시 붙자!</p><button class="btn ghost" data-go="kids">↩ 돌아가기</button></div>');
    render('<div class="top"><div class="who">⚔️ 형제 배틀</div><button class="btn ghost" style="width:auto;margin:0" data-go="kids">✖</button></div><div class="panel center"><p>번갈아 가며 10문제! 어떤 주제로 붙을까?</p></div>' +
      Object.keys(QUIZ).map(function (t) { return '<button class="btn" data-topic="' + esc(t) + '">' + QUIZ[t].emoji + ' ' + esc(t) + '</button>'; }).join(""));
  }
  function startBattle(topic) {
    var items = QUIZ[topic].items;
    M = { kind: "quiz", topic: topic, items: pickFresh(2, "quiz:" + topic, items, Math.min(10, items.length), quizKey), i: 0, ok: 0, lock: false, battle: true, sc: [0, 0], turn: 0 };
    combo = 0; showCombo(); stepQuiz();
  }
  function battleNext() {
    S.battleDay = today(); var w = M.sc[0] === M.sc[1] ? -1 : (M.sc[0] > M.sc[1] ? 0 : 1); if (w >= 0) S.kids[w].battles++; save(); confetti(120); beep("card");
    if (w >= 0) setTimeout(function () { checkBadges(w, { win: true }); }, 800);
    render('<div class="panel center"><div class="huge">' + (w < 0 ? '🤝' : '🏆') + '</div><div class="big">' + (w < 0 ? '무승부!' : esc(S.kids[w].name) + ' 승리!') + '</div><div class="score"><span>' + esc(S.kids[0].name) + ' ' + M.sc[0] + '</span><span>' + esc(S.kids[1].name) + ' ' + M.sc[1] + '</span></div><p class="muted">통산 승리: ' + esc(S.kids[0].name) + ' ' + S.kids[0].battles + ' · ' + esc(S.kids[1].name) + ' ' + S.kids[1].battles + '</p></div><button class="btn main" data-go="kids">돌아가기</button>');
  }

  // ---------- 카드첩 ----------
  function screenAlbum() {
    var k = kid(), sets = {}; CARDS.forEach(function (c) { (sets[c.set] = sets[c.set] || []).push(c); });
    var own = Object.keys(k.cards).length;
    render(top() + '<div class="center big" style="margin-bottom:8px">📚 카드첩 ' + own + ' / ' + CARDS.length + '</div>' +
      Object.keys(sets).map(function (s) { return '<div class="muted" style="color:#c9d4ea;margin:12px 0 6px">' + esc(s) + ' (' + sets[s].filter(function (c) { return k.cards[c.id]; }).length + '/' + sets[s].length + ')</div><div class="grid">' +
        sets[s].map(function (c) { var n = k.cards[c.id]; return n ? '<div class="cc g' + c.grade + '"><div class="em">' + pic(c) + '</div><div class="nm">' + esc(c.name) + '</div><div class="ct">' + (n > 1 ? 'x' + n : ["", "일반", "희귀", "전설"][c.grade]) + '</div></div>' : '<div class="cc no"><div class="em">❓</div><div class="nm">???</div><div class="ct">' + ["", "일반", "희귀", "전설"][c.grade] + '</div></div>'; }).join("") + '</div>'; }).join("") +
      '<button class="btn ghost" data-go="' + (dayState(S.cur).done ? 'locked' : 'home') + '" style="margin-top:16px">↩ 돌아가기</button>');
  }

  // ---------- 부모 ----------
  var pinBuf = "";
  function screenParent() {
    pinBuf = "";
    render('<div class="panel center"><h2>🔒 부모님 비밀번호</h2><div class="big" id="pinv">····</div><div class="pinpad">' + [1,2,3,4,5,6,7,8,9,"←",0,"확인"].map(function (n) { return '<button data-pin="' + n + '">' + n + '</button>'; }).join("") + '</div><button class="btn ghost" data-go="kids" style="color:#1f2430">돌아가기</button></div>');
  }
  function screenParentMenu() {
    render('<div class="panel"><h2>부모님 메뉴</h2>' +
      S.kids.map(function (k, i) { var d = dayState(i), h = (S.hist[i] || {})[today()] || {}; return '<p><b>' + esc(k.name || ("대원 " + (i + 1))) + '</b> · 오늘 ' + (d.done ? '완료(잠김)' : '진행 중') + ' · ✏️' + (h.d != null ? h.d : '-') + ' 🔤' + (h.e != null ? h.e : '-') + ' 🦖' + (h.q != null ? h.q : '-') + ' · 카드 ' + Object.keys(k.cards).length + '장 · 연속 ' + k.streak + '일' + ' <button class="tgl" data-redo="' + i + '">오늘 미션 처음부터 다시</button>' + (d.done ? '<button class="tgl" data-unlock="' + i + '">잠금만 풀기</button>' : '') + '</p>'; }).join("") +
      '<p><b>보상 게임 고르기</b> (초록색이 켜진 것)<br>' + GAMES.map(function (g) { return '<button class="tgl' + (S.games[g[0]] ? ' on' : '') + '" data-toggle="' + g[0] + '">' + g[1] + '</button>'; }).join("") + '</p>' +
      '<p class="muted">받아쓰기 급수: ' + esc(dictTitle()) + (ENGLISH.kids ? ENGLISH.kids.map(function (e, i) { return '<br>영어(' + esc(S.kids[i].name) + '): ' + esc(e.book) + ' · ' + esc(e.week); }).join("") : ' · 영어: ' + esc(ENGLISH.week)) + '</p>' +
      '<button class="btn" data-go="names" style="box-shadow:none;background:#eef1f7">이름 바꾸기</button>' +
      '<button class="btn" data-go="resetbattle" style="box-shadow:none;background:#eef1f7">오늘 배틀 다시 열기</button>' +
      '<button class="btn" data-go="resetseen" style="box-shadow:none;background:#eef1f7">나온 문제 기록 지우기 (처음 문제부터 다시)</button>' +
      '<button class="btn ghost" data-go="kids" style="color:#1f2430">닫기</button></div>');
  }

  // ---------- 이벤트 ----------
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var kidIdx = b.getAttribute("data-kid"), go = b.getAttribute("data-go"), opt = b.getAttribute("data-opt"), topic = b.getAttribute("data-topic"), pin = b.getAttribute("data-pin"), unlock = b.getAttribute("data-unlock"), redo = b.getAttribute("data-redo");
    if (kidIdx !== null) { S.cur = +kidIdx; save(); return screenHome(); }
    if (opt !== null) { if (M.kind === "dict") answerDict(opt); else if (M.kind === "eng") answerEng(opt); else answerQuiz(b); return; }
    if (topic) return startBattle(topic);
    if (b.hasAttribute("data-qtopic")) return startQuiz(b.getAttribute("data-qtopic"), 10);
    if (b.hasAttribute("data-tile")) return tapTile(+b.getAttribute("data-tile"));
    if (b.hasAttribute("data-hole")) return tapHole(+b.getAttribute("data-hole"));
    if (b.hasAttribute("data-bal")) return tapBalloon(b);
    if (b.hasAttribute("data-toggle")) { var gk = b.getAttribute("data-toggle"); S.games[gk] = !S.games[gk]; save(); return screenParentMenu(); }
    if (redo !== null) { dayState(+redo); S.day.k[+redo] = {}; save(); return screenParentMenu(); }
    if (pin !== null) {
      if (pin === "←") pinBuf = pinBuf.slice(0, -1); else if (pin === "확인") { if (pinBuf === S.pin) return screenParentMenu(); pinBuf = ""; beep("bad"); } else if (pinBuf.length < 4) pinBuf += pin;
      $("pinv").textContent = (pinBuf + "····").slice(0, 4).replace(/\d/g, "●"); return;
    }
    if (unlock !== null) { var d = dayState(+unlock); d.done = false; d.reward = false; delete d.rewardStart; save(); return screenParentMenu(); }
    switch (go) {
      case "kids": stopGame(); clearInterval(timerId); combo = 0; showCombo(); return screenKids();
      case "home": stopGame(); return screenHome();
      case "savenames": S.kids[0].name = ($("n0").value || "첫째").trim(); S.kids[1].name = ($("n1").value || "둘째").trim(); save(); return screenKids();
      case "names": return screenNames();
      case "dict": return startDict();
      case "eng": return startEng();
      case "quizpick": return screenQuizPick();
      case "quiz": return startQuiz(topicOfDay(), 10);
      case "say": var it = M.items[M.i]; return M.kind === "eng" ? speak(it.w.en, "en-US") : sayKo(it.s);
      case "tileback": if (M.sp && !M.lock) { M.sp.picked.pop(); drawTiles(); } return;
      case "tilegiveup": return answerEng("");
      case "check": return answerDict(($("typed").value || "").trim());
      case "giveup": return answerDict("");
      case "next": M.i++; M.lock = false; if (M.battle) M.turn = 1 - M.turn; return M.kind === "dict" ? stepDict() : M.kind === "eng" ? stepEng() : stepQuiz();
      case "card": return drawCard();
      case "reward": return screenReward();
      case "gmem": return startMem();
      case "gmole": return startMole();
      case "gcatch": return startCatch();
      case "gballoon": return startBalloon();
      case "resetseen": S.seen = [{}, {}, {}]; save(); return screenParentMenu();
      case "endreward": return endReward();
      case "album": return screenAlbum();
      case "stats": return screenStats();
      case "badges": return screenBadges();
      case "locked": stopGame(); return screenLocked();
      case "battle": return screenBattle();
      case "parent": return screenParent();
      case "resetbattle": S.battleDay = ""; save(); return screenParentMenu();
    }
  });
  app.addEventListener("click", function (e) { var mem = e.target.closest("[data-mem]"); if (mem) tapMem(+mem.getAttribute("data-mem")); });
  app.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.id === "typed") answerDict((e.target.value || "").trim()); });
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () {};

  screenKids();
})();
</script>
</body>
</html>
